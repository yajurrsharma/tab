<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Serve Up</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body class="w-95 min-h-120 bg-black bg-[url('./pattern.svg')] bg-repeat bg-size-[80px_80px] text-white">

    <main class="p-5">
        <section class="border border-neutral-700 bg-black p-5 text-center">

            <header>

            <h1 class="mt-4 flex flex-col items-center font-black uppercase leading-none">
                <span class="text-xl tracking-[0.2em] text-white">Serve</span>
                <span class="text-5xl tracking-tighter text-red-500">UP.</span>
            </h1>

        </header>

        <div class="my-6 border-t border-neutral-700"></div>

        <p class="font-mono text-xs uppercase tracking-widest text-neutral-400">
            Tabs awaiting trial
        </p>

        <h2 id="tab-count" class="mt-3 text-6xl font-black text-white">
            --
        </h2>

        <p class="mt-3 font-mono text-xs text-red-500">
            COUNTS OF NEGLIGENCE OF BROWSER MEMORY
        </p>

        <button id="begin-trial" class="mt-6 w-full border border-white bg-white px-4 py-3 font-mono text-xs font-bold uppercase tracking-[0.2em] text-black cursor-pointer transition-colors hover:border-red-500 hover:bg-red-500 hover:text-white">
            BEGIN TRIAL
        </button>

        </section>

        <section id="trial-results" class="mt-4 hidden border border-neutral-700 bg-black p-5">
        </section>
        <section id="stale-results" class="mt-4 hidden border border-neutral-700 bg-black p-5">
        </section>
        <section id="pardon-registry" class="mt-4 hidden border border-neutral-700 bg-black p-5">
            <h2 class="mb-4 font-mono text-sm font-bold text-red-500">
                PARDONED RECORDS
            </h2>

            <div id="pardoned-list"></div>
        </section>

    </main>
<script src="popup.js"></script>
</body>
</html>
